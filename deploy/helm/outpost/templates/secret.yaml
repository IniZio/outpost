{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "outpost.secretName" . }}
  labels: {{- include "outpost.labels" . | nindent 4 }}
type: Opaque
stringData:
  OUTPOST_DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  OUTPOST_SECRET_KEY: {{ required "secrets.secretKey is required (or set secrets.existingSecret)" .Values.secrets.secretKey | quote }}
  OUTPOST_PROXY_TOKEN: {{ required "secrets.proxyToken is required (or set secrets.existingSecret)" .Values.secrets.proxyToken | quote }}
{{- end }}
{{- if .Values.proxy.url }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-proxy-ca
  labels: {{- include "outpost.labels" . | nindent 4 }}
data:
  ca.pem: {{ required "proxy.caPem is required when proxy.url is set" .Values.proxy.caPem | quote }}
{{- end }}
