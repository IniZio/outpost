{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "outpost.labels" . | nindent 4 }}
  {{- $ann := dict }}
  {{- if eq .Values.ingress.className "nginx" }}
  {{- $ann = dict "nginx.ingress.kubernetes.io/proxy-read-timeout" "86400" "nginx.ingress.kubernetes.io/proxy-send-timeout" "86400" "nginx.ingress.kubernetes.io/proxy-buffering" "off" }}
  {{- end }}
  {{- $ann = merge (deepCopy .Values.ingress.annotations) $ann }}
  {{- with $ann }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className is required" .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ required "host is required" .Values.host | quote }}]
  {{- end }}
  rules:
    - host: {{ required "host is required" .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { name: http }
{{- end }}
